<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1분 선물 테스트 · 슈크림마을 선물가게</title>
<meta name="description" content="받는 사람과 자리만 고르면 딱 맞는 3만원대 선물을 골라드려요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="logo" href="index.html">🧁 선물 테스트</a>
  <div id="nav-auth"></div>
</div></nav>

<main class="wrap" style="padding-bottom:60px">
  <div class="progress"><i id="bar" style="width:0"></i></div>
  <p class="q-no" id="qno"></p>
  <h1 class="q-title" id="qtitle"></h1>
  <div class="opts" id="opts"></div>
  <button class="back" id="back" type="button" hidden>← 이전 문항</button>
</main>

<script>
(function () {
  var S = window.Shop, Q = S.QUESTIONS, step = 0, answers = [];
  function render() {
    var q = Q[step];
    document.getElementById('bar').style.width = (step / Q.length * 100) + '%';
    document.getElementById('qno').textContent = 'Q' + (step + 1) + ' / ' + Q.length;
    document.getElementById('qtitle').textContent = q.q;
    document.getElementById('back').hidden = step === 0;
    var box = document.getElementById('opts');
    box.innerHTML = '';
    q.a.forEach(function (o, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.textContent = o.t;
      b.onclick = function () { pick(i); };
      box.appendChild(b);
    });
  }
  function pick(i) {
    answers[step] = i;
    if (step < Q.length - 1) { step++; render(); return; }
    var r = S.scoreTest(answers);
    // 결과를 잠깐 기억해뒀다가, 로그인하면 고객DB에 저장합니다
    S.store('pending_result', {
      key: r.key, product: r.product, know: r.know,
      answers: answers.map(function (ai, qi) { return { q: Q[qi].q, a: Q[qi].a[ai].t }; })
    });
    location.href = S.page('result', { t: r.key, p: r.product, k: r.know });
  }
  document.getElementById('back').onclick = function () { if (step > 0) { step--; render(); } };
  render();
})();
</script>
</body>
</html>
