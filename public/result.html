<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 선물 유형 · 슈크림마을 선물가게</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="logo" href="index.html">🧁 선물 테스트 결과</a>
  <div id="nav-auth"></div>
</div></nav>

<main class="wrap" style="padding:28px 20px 60px">
  <div class="result-card">
    <div class="emoji" id="r-emoji">🎁</div>
    <p class="eyebrow" style="margin:6px 0 0">나의 선물 유형</p>
    <div class="type" id="r-type"></div>
    <p class="line" id="r-line"></p>
    <p class="line" id="r-know" style="margin-top:10px"></p>
  </div>

  <h2 style="margin-top:36px">그래서 추천하는 세트</h2>
  <div class="products" id="r-product"></div>

  <!-- 가두리망: 결과를 보고 끝나지 않고, 로그인해서 고객DB에 남게 하는 자리 -->
  <div class="gate" id="gate">
    <h3>이 결과, 저장해둘까요?</h3>
    <p>카카오로 3초 만에 로그인하면 결과가 저장되고,<br>다음에 다시 와도 바로 주문할 수 있어요.</p>
    <button class="btn kakao" id="save-btn" type="button">카카오로 결과 저장하기</button>
  </div>
  <div class="saved" id="saved" hidden>✅ 결과가 저장됐어요</div>

  <p class="center mt"><a href="test.html" class="muted">테스트 다시 하기</a> · <a href="index.html#products" class="muted">다른 세트 보기</a></p>
</main>

<script>
(function () {
  var S = window.Shop;
  var key = S.qs('t'), pid = S.qs('p'), know = S.qs('k');
  var type = S.TYPES[key];
  if (!type) { location.href = 'test.html'; return; }
  var p = S.PRODUCTS[pid] || S.PRODUCTS[type.product];
  var KNOW = { know: '취향을 알고 계시니, 메시지 카드에 그 사람만 아는 이야기 한 줄을 적어보세요.',
               some: '대충 아는 정도라면 여러 맛이 골고루 든 구성이 실패가 없어요.',
               none: '취향을 몰라도 괜찮아요. 그래서 이 세트는 호불호 없는 맛으로만 채웠어요.' };

  document.getElementById('r-emoji').textContent = type.emoji;
  document.getElementById('r-type').textContent = type.name;
  document.getElementById('r-line').textContent = type.line;
  document.getElementById('r-know').textContent = KNOW[know] || '';
  document.getElementById('r-product').innerHTML =
    '<div class="p-card best"><span class="tag">당신을 위한 추천</span>' +
    '<h3>' + S.esc(p.name) + '</h3><div class="price">' + S.won(p.price) + '</div>' +
    '<ul>' + p.items.map(function (i) { return '<li>' + S.esc(i) + '</li>'; }).join('') + '</ul>' +
    '<p>' + S.esc(p.desc) + '</p>' +
    '<a class="btn main block" href="' + S.page('order', { product: p.id }) + '">이 세트로 주문하기 →</a></div>';

  function showSaved() {
    document.getElementById('gate').hidden = true;
    document.getElementById('saved').hidden = false;
  }

  // 이미 로그인한 사람이면 바로 저장
  S.getUser().then(function (u) {
    if (u) S.saveTestResult(u).then(function (ok) { if (ok) showSaved(); else document.getElementById('gate').hidden = true; });
  });

  document.getElementById('save-btn').onclick = function () { S.login('result.html' + location.search); };
})();
</script>
</body>
</html>
